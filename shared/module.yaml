product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation3.ui
  - $libs.kotlinx.coroutines.core

test-dependencies:
  - $libs.kotlinx.coroutines.test

# Skia's native library for decoding images in the JVM tests
test-dependencies@jvm:
  - $compose.desktop.currentOs

# The desktop MCP server's JSON-RPC (ControlServer)
dependencies@jvm:
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0

dependencies@android:
  - $compose.uiTooling

settings:
  jvm:
    test:
      systemProperties:
        # The offscreen Saves screen starts AWT: a test JVM must never wait on AppKit's init
        java.awt.headless: "true"
  # Enables the @Serializable compiler plugin and the kotlinx.serialization core
  # library, required for type-safe Navigation 3 route keys.
  kotlin:
    serialization: enabled
    # AudioOutput is an expect/actual class (Beta)
    freeCompilerArgs: [ -Xexpect-actual-classes ]
  compose:
    enabled: true
    resources:
      packageName: dev.pelotasplus.ishar.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
